<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <!-- Organic 8-Petal Matisse Flower Watermark with soft opacity for section backgrounds -->
  <g transform="translate(300, 300)" opacity="0.14">
    <!-- 8 organic petals filled with soft translucent teal (#16A099) -->
    <!-- Petal 1: Top -->
    <path fill="#16A099" d="M -22,-35 C -45,-110 -30,-180 0,-190 C 30,-180 45,-110 22,-35 Z" />
    <!-- Petal 2: Top-Right -->
    <path fill="#16A099" d="M 22,-25 C 88,-80 145,-120 170,-90 C 185,-60 125,-20 35,22 Z" />
    <!-- Petal 3: Right -->
    <path fill="#16A099" d="M 35,-22 C 110,-45 180,-30 190,0 C 180,30 110,45 35,22 Z" />
    <!-- Petal 4: Bottom-Right -->
    <path fill="#16A099" d="M 25,22 C 80,88 120,145 90,170 C 60,185 20,125 -22,35 Z" />
    <!-- Petal 5: Bottom -->
    <path fill="#16A099" d="M 22,35 C 45,110 30,180 0,190 C -30,180 -45,110 -22,35 Z" />
    <!-- Petal 6: Bottom-Left -->
    <path fill="#16A099" d="M -22,25 C -88,80 -145,120 -170,90 C -185,60 -125,20 -35,-22 Z" />
    <!-- Petal 7: Left -->
    <path fill="#16A099" d="M -35,22 C -110,45 -180,30 -190,0 C -180,-30 -110,-45 -35,-22 Z" />
    <!-- Petal 8: Top-Left -->
    <path fill="#16A099" d="M -25,-22 C -80,-88 -120,-145 -90,-170 C -60,-185 -20,-125 22,-35 Z" />

    <!-- Organic fused center base -->
    <circle cx="0" cy="0" r="55" fill="#16A099"/>

    <!-- Central Purple Dot (#532675) -->
    <circle cx="0" cy="0" r="35" fill="#532675"/>
  </g>
</svg>
