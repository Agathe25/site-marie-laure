<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Centered Matisse flower with generous canvas padding and Pure White (#FFFFFF) petals -->
  <g transform="translate(100, 100)">
    <!-- 8 organic rounded petals in Pure White (#FFFFFF) -->
    <!-- Petal 1: Top -->
    <path fill="#FFFFFF" d="M -9,-14 C -18,-45 -12,-72 0,-76 C 12,-72 18,-45 9,-14 Z" />
    <!-- Petal 2: Top-Right -->
    <path fill="#FFFFFF" d="M 9,-10 C 35,-32 58,-48 68,-36 C 74,-24 50,-8 14,9 Z" />
    <!-- Petal 3: Right -->
    <path fill="#FFFFFF" d="M 14,-9 C 45,-18 72,-12 76,0 C 72,12 45,18 14,9 Z" />
    <!-- Petal 4: Bottom-Right -->
    <path fill="#FFFFFF" d="M 10,9 C 32,35 48,58 36,68 C 24,74 8,50 -9,14 Z" />
    <!-- Petal 5: Bottom -->
    <path fill="#FFFFFF" d="M 9,14 C 18,45 12,72 0,76 C -12,72 -18,45 -9,14 Z" />
    <!-- Petal 6: Bottom-Left -->
    <path fill="#FFFFFF" d="M -9,10 C -35,32 -58,48 -68,36 C -74,24 -50,8 -14,-9 Z" />
    <!-- Petal 7: Left -->
    <path fill="#FFFFFF" d="M -14,9 C -45,18 -72,12 -76,0 C -72,-12 -45,-18 -14,-9 Z" />
    <!-- Petal 8: Top-Left -->
    <path fill="#FFFFFF" d="M -10,-9 C -32,-35 -48,-58 -36,-68 C -24,-74 -8,-50 9,-14 Z" />

    <!-- Organic fused center base -->
    <circle cx="0" cy="0" r="22" fill="#FFFFFF"/>

    <!-- Central Purple Dot (#532675) -->
    <circle cx="0" cy="0" r="14" fill="#532675"/>
  </g>
</svg>
