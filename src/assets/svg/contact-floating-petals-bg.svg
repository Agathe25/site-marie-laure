<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%" fill="none">
  <g fill="#FFFFFF" opacity="0.22">
    <!-- Top-left cluster of delicate white petals -->
    <g transform="translate(100, 90) rotate(25) scale(0.95)">
      <path d="M 0,-18 C -9,-42 -14,-68 0,-74 C 14,-68 9,-42 0,-18 Z" />
      <path d="M 0,0 C 16,-10 35,-16 42,0 C 35,16 16,10 0,0 Z" />
      <path d="M 0,0 C -16,10 -35,16 -42,0 C -35,-16 -16,-10 0,0 Z" />
    </g>

    <!-- Mid-left floating petal -->
    <g transform="translate(160, 430) rotate(-45) scale(1.15)">
      <path d="M 0,-18 C -10,-48 -14,-78 0,-85 C 14,-78 10,-48 0,-18 Z" />
    </g>

    <!-- Top-center subtle petal pair -->
    <g transform="translate(620, 50) rotate(70) scale(0.85)">
      <path d="M 0,-15 C -8,-40 -12,-65 0,-70 C 12,-65 8,-40 0,-15 Z" />
      <path d="M 10,8 C 30,30 45,50 32,60 C 20,65 8,45 -10,8 Z" />
    </g>

    <!-- Top-right cluster of white petals -->
    <g transform="translate(1090, 110) rotate(-30) scale(1.25)">
      <path d="M 0,-18 C -10,-48 -14,-78 0,-85 C 14,-78 10,-48 0,-18 Z" />
      <path d="M 0,0 C 18,-12 38,-18 45,0 C 38,18 18,12 0,0 Z" />
      <path d="M 0,0 C -12,14 -28,28 -32,18 C -28,8 -12,4 0,0 Z" />
    </g>

    <!-- Bottom-right floating petal cluster -->
    <g transform="translate(1040, 470) rotate(55) scale(1.05)">
      <path d="M 0,-15 C -8,-40 -12,-65 0,-70 C 12,-65 8,-40 0,-15 Z" />
      <path d="M 0,0 C 15,-10 32,-15 38,0 C 32,15 15,10 0,0 Z" />
    </g>

    <!-- Center-bottom background floating petal -->
    <g transform="translate(480, 510) rotate(-15) scale(0.9)">
      <path d="M 0,-18 C -10,-48 -14,-78 0,-85 C 14,-78 10,-48 0,-18 Z" />
    </g>

    <!-- Far left bottom floating single petal -->
    <g transform="translate(40, 280) rotate(110) scale(0.8)">
      <path d="M 0,-18 C -10,-48 -14,-78 0,-85 C 14,-78 10,-48 0,-18 Z" />
    </g>

    <!-- Far right mid floating single petal -->
    <g transform="translate(1160, 310) rotate(-75) scale(0.85)">
      <path d="M 0,-18 C -10,-48 -14,-78 0,-85 C 14,-78 10,-48 0,-18 Z" />
    </g>
  </g>
</svg>
