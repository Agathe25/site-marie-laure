<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 775" fill="none" stroke="currentColor" id="growingStemSvg">
  <style>
    .stem-line { stroke: #16A099; stroke-width: 2.8; stroke-linecap: round; stroke-linejoin: round; }
    .leaf-path { fill: #EBF7F6; stroke: #16A099; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .seed-dot { fill: #532675; stroke: #3F1C5A; stroke-width: 1.5; }
    .bud-path { fill: #F4EFF8; stroke: #532675; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .flower-bottom { fill: #EBF7F6; stroke: #16A099; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .flower-center { fill: #532675; stroke: none; }

    /* Clean opacity-only transitions for SVG scroll elements */
    .scroll-elem {
      opacity: 0;
      transition: opacity 0.45s ease-out;
    }
    .scroll-elem.revealed {
      opacity: 1;
    }
  </style>

  <!-- 1. BASE SEED AT TOP (Graine en haut au début du cheminement) -->
  <g id="seed-base-top" class="scroll-elem revealed">
    <path d="M 90 18 C 92 10, 100 5, 104 2" class="stem-line" stroke-width="1.8" opacity="0.6"/>
    <ellipse cx="90" cy="32" rx="9" ry="14" class="seed-dot" transform="rotate(15, 90, 32)" />
  </g>

  <!-- 2. DESCENDING CONTINUOUS STEM (Tige sinueuse qui descend du haut jusqu'à y=710) -->
  <path id="growingStemPath" d="
    M 90 45
    C 95 80, 120 110, 115 160
    C 110 210, 65 240, 70 300
    C 75 360, 125 390, 115 460
    C 105 540, 75 620, 90 710
  " class="stem-line" />

  <!-- 3. STAGE 1: FIRST SPROUT -->
  <g id="stage-sprout" class="scroll-elem">
    <path d="M 112 125 C 132 130, 138 145, 125 150 C 118 142, 114 132, 112 125 Z" class="leaf-path" />
    <path d="M 114 140 C 98 150, 90 162, 104 165 C 112 157, 114 148, 114 140 Z" class="leaf-path" />
    <circle cx="113" cy="133" r="3" class="flower-center" opacity="0.7"/>
  </g>

  <!-- 4. STAGE 2: FLOWER BUD -->
  <g id="stage-bud" class="scroll-elem">
    <path d="M 72 280 C 52 278, 45 290, 58 298 C 66 292, 70 285, 72 280 Z" class="leaf-path" />
    <path d="M 72 280 C 55 285, 50 315, 68 325 C 84 315, 80 285, 72 280 Z" class="bud-path" />
    <path d="M 72 280 C 65 290, 62 310, 68 325" stroke="#532675" stroke-width="1.5" fill="none"/>
    <circle cx="71" cy="290" r="3.5" class="flower-center" opacity="0.8"/>
  </g>

  <!-- 5. STAGE 3: EXPANDING BLOOM -->
  <g id="stage-blooming-bud" class="scroll-elem">
    <path d="M 118 420 C 138 425, 142 440, 130 445 C 123 437, 120 428, 118 420 Z" class="leaf-path" />
    <path d="M 117 435 C 135 450, 140 475, 122 480 C 112 468, 115 450, 117 435 Z" class="bud-path" />
    <path d="M 117 435 C 105 455, 92 475, 110 485 C 122 472, 119 452, 117 435 Z" class="bud-path" />
    <circle cx="117" cy="445" r="4" class="flower-center"/>
  </g>

  <!-- 6. BOTTOM HARVEST: FULL BLOSSOM FLOWER AT BOTTOM OF STEM (cy = 730, separated wrapper to guarantee exact position in all browsers) -->
  <g id="bottom-full-flower" class="scroll-elem">
    <g transform="translate(90, 730)">
      <g class="flower-bottom">
        <path d="M 0,0 C -10,-18 -14,-36 0,-42 C 14,-36 10,-18 0,0 Z" />
        <path d="M 0,0 C 18,-10 36,-14 42,0 C 36,14 18,10 0,0 Z" />
        <path d="M 0,0 C 10,18 14,36 0,42 C -14,36 -10,18 0,0 Z" />
        <path d="M 0,0 C -18,10 -36,14 -42,0 C -36,-14 -18,-10 0,0 Z" />

        <path d="M 0,0 C 12,-12 28,-28 30,-30 C 28,-30 12,-12 0,0 Z" opacity="0.4"/>
        <path d="M 0,0 C 12,12 28,28 30,30 C 28,30 12,12 0,0 Z" opacity="0.4"/>
        <path d="M 0,0 C -12,12 -28,28 -30,30 C -28,30 -12,12 0,0 Z" opacity="0.4"/>
        <path d="M 0,0 C -12,-12 -28,-28 -30,-30 C -28,-30 -12,-12 0,0 Z" opacity="0.4"/>

        <path d="M 0,0 C 14,-14 30,-22 23,-30 C 16,-30 4,-14 0,0 Z" />
        <path d="M 0,0 C 14,14 30,22 23,30 C 16,30 4,14 0,0 Z" />
        <path d="M 0,0 C -14,14 -30,22 -23,30 C -16,30 -4,14 0,0 Z" />
        <path d="M 0,0 C -14,-14 -30,-22 -23,-30 C -16,-30 -4,-14 0,0 Z" />
      </g>
      <!-- Central aubergine core dot -->
      <circle cx="0" cy="0" r="10.5" class="flower-center" />
    </g>
  </g>
</svg>
